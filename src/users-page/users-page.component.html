<section class="users-page">
  <div class="container">
    <h1 class="users-page__title">Список пользователей</h1>
    <app-user-create (createUser)="createUser($event)"></app-user-create>
    <app-users-filter (searchChange)="setSearchQuery($event)"></app-users-filter>

    @if (filteredUsers$ | async; as users) {
      <div class="users-page__grid">
        @for (user of users; track user.id) {
          <app-user-card [user]="user" (deleteUser)="deleteUser($event)"></app-user-card>
        } @empty {
          <p class="users-page__empty">Нет пользователей для отображения</p>
        }
      </div>
    }
  </div>
</section>
